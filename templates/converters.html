<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<title>SmartStudyAI Converters</title>

<style>
/* ===== CONVERTER ANIMATIONS & STYLES ===== */
body{
    font-family: 'Segoe UI', 'Helvetica Neue', sans-serif;
    background: linear-gradient(135deg, #1e1e2f 0%, #2b2b4f 50%, #1a1a2e 100%);
    color: white;
    text-align: center;
    min-height: 100vh;
    overflow-x: hidden;
    animation: fadeIn 0.8s ease-out;
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

.converter-wrapper{
    display: flex;
    justify-content: center;
    gap: 40px;
    margin-top: 80px;
    flex-wrap: wrap;
    max-width: 1200px;
    margin-left: auto;
    margin-right: auto;
    padding: 0 20px;
}

.converter-card{
    background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02));
    padding: 35px;
    border-radius: 20px;
    width: 320px;
    border: 1px solid rgba(255,255,255,0.06);
    box-shadow: 0 8px 40px rgba(10,15,50,0.15);
    position: relative;
    transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
    overflow: hidden;
    animation: slideUpFloat 0.8s ease-out;
    animation-fill-mode: both;
}

.converter-card::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle, rgba(0, 242, 255, 0.08), transparent);
    opacity: 0;
    transition: opacity 0.4s ease;
    pointer-events: none;
}

.converter-card:hover::before {
    opacity: 1;
}

.converter-card:nth-child(1) {
    animation-delay: 0.1s;
}

.converter-card:nth-child(2) {
    animation-delay: 0.2s;
}

.converter-card:nth-child(3) {
    animation-delay: 0.3s;
}

@keyframes slideUpFloat {
    from {
        opacity: 0;
        transform: translateY(50px) scale(0.95);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.converter-card:hover {
    transform: translateY(-15px) scale(1.02);
    box-shadow: 0 25px 60px rgba(0, 242, 255, 0.2);
    border-color: rgba(0, 242, 255, 0.3);
    background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.04));
}

.converter-card h3 {
    font-size: 26px;
    font-weight: 700;
    margin-bottom: 20px;
    background: linear-gradient(135deg, #00f2ff, #00ff88);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 0.5px;
    animation: glow 2s ease-in-out infinite alternate;
}

@keyframes glow {
    from { filter: drop-shadow(0 0 5px rgba(0, 242, 255, 0.5)); }
    to { filter: drop-shadow(0 0 15px rgba(0, 255, 136, 0.5)); }
}

.converter-card form {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
}

.converter-card input[type="file"] {
    width: 100%;
    padding: 15px;
    margin: 10px 0;
    border: 2px dashed rgba(78,115,223,0.4);
    border-radius: 12px;
    background: linear-gradient(90deg, rgba(78,115,223,0.02), rgba(28,200,138,0.02));
    color: white;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.3s ease;
}

.converter-card input[type="file"]:hover {
    border-color: rgba(78,115,223,0.7);
    background: linear-gradient(90deg, rgba(78,115,223,0.05), rgba(28,200,138,0.03));
    transform: scale(1.02);
}

.converter-card input[type="file"]::file-selector-button {
    padding: 8px 16px;
    background: linear-gradient(135deg, #4e73df, #1cc88a);
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    margin-right: 10px;
    transition: all 0.3s ease;
}

.converter-card input[type="file"]::file-selector-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(78, 115, 223, 0.3);
}

.converter-card button {
    padding: 15px 35px;
    border: none;
    border-radius: 25px;
    background: linear-gradient(135deg, #00f2ff, #00ff88);
    color: #1e1e2f;
    font-weight: 700;
    font-size: 16px;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 8px 25px rgba(0, 242, 255, 0.3);
    position: relative;
    overflow: hidden;
}

.converter-card button::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 0;
    height: 0;
    background: rgba(255, 255, 255, 0.3);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    transition: width 0.6s, height 0.6s;
}

.converter-card button:hover::before {
    width: 300px;
    height: 300px;
}

.converter-card button:hover {
    transform: translateY(-3px) scale(1.05);
    box-shadow: 0 15px 40px rgba(0, 242, 255, 0.5);
}

.converter-card button:active {
    transform: translateY(-1px) scale(1.02);
}

/* Floating background elements */
.floating-bg {
    position: fixed;
    pointer-events: none;
    z-index: -1;
}

.floating-bg-1 {
    top: 10%;
    left: 10%;
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, rgba(0, 242, 255, 0.1), transparent);
    border-radius: 50%;
    animation: float1 8s ease-in-out infinite;
}

.floating-bg-2 {
    top: 60%;
    right: 15%;
    width: 250px;
    height: 250px;
    background: radial-gradient(circle, rgba(0, 255, 136, 0.08), transparent);
    border-radius: 50%;
    animation: float2 10s ease-in-out infinite;
}

.floating-bg-3 {
    bottom: 20%;
    left: 20%;
    width: 200px;
    height: 200px;
    background: radial-gradient(circle, rgba(78, 115, 223, 0.06), transparent);
    border-radius: 50%;
    animation: float3 12s ease-in-out infinite;
}

@keyframes float1 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    25% { transform: translate(30px, -40px) scale(1.1); }
    50% { transform: translate(-20px, 30px) scale(0.9); }
    75% { transform: translate(40px, 20px) scale(1.05); }
}

@keyframes float2 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(-40px, 30px) scale(0.95); }
    66% { transform: translate(30px, -30px) scale(1.1); }
}

@keyframes float3 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(25px, -25px) scale(1.2); }
}

/* Title animation */
h1 {
    font-size: 48px;
    font-weight: 800;
    margin-bottom: 20px;
    background: linear-gradient(135deg, #00f2ff, #00ff88, #4e73df);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: titleSlide 0.8s ease-out, titleGlow 3s ease-in-out infinite alternate;
    letter-spacing: -1px;
}

@keyframes titleSlide {
    from {
        opacity: 0;
        transform: translateY(-50px) scale(0.9);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

@keyframes titleGlow {
    from { filter: drop-shadow(0 0 10px rgba(0, 242, 255, 0.5)); }
    to { filter: drop-shadow(0 0 20px rgba(0, 255, 136, 0.5)); }
}

/* Responsive adjustments */
@media (max-width: 768px) {
    .converter-wrapper {
        gap: 20px;
        margin-top: 60px;
    }
    
    .converter-card {
        width: 100%;
        max-width: 350px;
    }
    
    h1 {
        font-size: 36px;
    }
}

</style>

</head>

<body>

<!-- Navigation Bar -->

<h1>📂 SmartStudyAI Converters</h1>

<!-- Floating background elements -->
<div class="floating-bg floating-bg-1"></div>
<div class="floating-bg floating-bg-2"></div>
<div class="floating-bg floating-bg-3"></div>

<div class="converter-wrapper">

<!-- PDF TO WORD -->

<div class="converter-card">

<h3>PDF → Word</h3>

<form action="/convert-pdf-to-word" method="POST" enctype="multipart/form-data">

<input type="file" name="file" accept=".pdf" required>

<br>

<button type="submit">Convert</button>

</form>

</div>


<!-- WORD TO PDF -->

<div class="converter-card">

<h3>Word → PDF</h3>

<form action="/convert-word-to-pdf" method="POST" enctype="multipart/form-data">

<input type="file" name="file" accept=".docx" required>

<br>

<button type="submit">Convert</button>

</form>

</div>


<!-- PPT TO PDF -->

<div class="converter-card">

<h3>PPT → PDF</h3>

<form action="/convert-ppt-to-pdf" method="POST" enctype="multipart/form-data">

<input type="file" name="file" accept=".ppt,.pptx" required>

<br>

<button type="submit">Convert</button>

</form>

</div>

</div>

</body>
</html>
